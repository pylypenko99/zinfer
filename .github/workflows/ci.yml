name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Zig 0.17.1
        run: |
          curl -sSL "https://ziglang.org/download/0.17.1/zig-x86_64-linux-0.17.1.tar.xz" -o /tmp/zig.tar.xz
          tar -xf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/zig-x86_64-linux-0.17.1" >> $GITHUB_PATH

      - name: Verify Zig version
        run: zig version

      - name: Build zinfer (ReleaseFast)
        run: zig build -Doptimize=ReleaseFast

      - name: Cross-compile for Windows (x86_64-windows AVX2)
        run: zig build -Dtarget=x86_64-windows -Doptimize=ReleaseFast -Dcpu=x86_64_v3

      - name: Run Test Suite
        run: zig test -OReleaseSafe -mcpu=native src/tests.zig
